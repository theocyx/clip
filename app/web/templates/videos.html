{% extends "base.html" %}{% block content %}
<div class="card">
  <h3>Clipper une vidéo ou un live</h3>
  <form method="post" action="/videos">
    <input type="url" name="url" placeholder="Lien YouTube ou Twitch (vidéo, rediffusion ou live)" required> <button>Ajouter</button>
  </form>
</div>
<div class="card">
  <p><a href="/videos{{ '' if all else '?all=1' }}">{{ 'Masquer les vidéos ignorées' if all else 'Afficher aussi les vidéos ignorées' }}</a></p>
  {% include "_videos_table.html" %}
</div>
{% endblock %}
